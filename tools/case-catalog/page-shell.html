<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>PinK 构建用例</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #202224;
        --surface: #26282b;
        --field: #303235;
        --line: #45494f;
        --ink: #e2e6eb;
        --muted: #b0b8c3;
        --blue: #a2c9f3;
        --selected: #293440;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font:
          14px/1.6 "Segoe UI",
          "Microsoft YaHei UI",
          sans-serif;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--blue);
        text-underline-offset: 3px;
        overflow-wrap: anywhere;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      header {
        min-height: 64px;
        border-bottom: 1px solid var(--line);
        padding: 16px 30px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header strong {
        font-weight: 600;
      }
      header span {
        color: var(--muted);
        font-size: 12px;
      }
      main {
        max-width: 1000px;
        margin: 32px auto 64px;
        padding: 0 28px;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 20px;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
        margin: 0;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 12px;
      }
      .muted {
        color: var(--muted);
      }
      .category-nav {
        display: flex;
        gap: 28px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 28px;
      }
      .category-nav button {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        padding: 0 4px 12px;
        font-size: 15px;
      }
      .category-nav button[aria-current] {
        color: var(--blue);
        border-bottom-color: var(--blue);
      }
      .platform-heading {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 0 0 24px;
      }
      .platform-heading label {
        font-size: 12px;
        color: var(--muted);
      }
      select {
        border: 1px solid #626a75;
        background: var(--field);
        border-radius: 4px;
        padding: 8px 12px;
        min-width: 220px;
        max-width: 100%;
      }
      .combination-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin: 24px 0 32px;
      }
      .combo-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        text-align: left;
        padding: 0;
        min-width: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .combo-card:hover {
        border-color: #8ca8c8;
        background: #2b3036;
      }
      .card-title {
        padding: 18px 20px 12px;
        color: #cbdff5;
        font-weight: 600;
        font-size: 16px;
      }
      .card-fields {
        padding: 0 20px 18px;
        display: grid;
        gap: 7px;
        flex: 1;
      }
      .card-fields > span {
        display: grid;
        grid-template-columns: minmax(105px, 1fr) minmax(0, 1.2fr);
        gap: 12px;
        font-size: 12px;
      }
      .card-fields em {
        font-style: normal;
        color: var(--muted);
      }
      .card-fields b {
        font-weight: 400;
        text-align: right;
        overflow-wrap: anywhere;
      }
      .coverage-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
      }
      .card-bottom {
        border-top: 1px solid var(--line);
        padding: 10px 20px;
        color: var(--blue);
        font-size: 12px;
        display: flex;
        justify-content: space-between;
      }
      .back {
        background: none;
        border: 0;
        color: var(--blue);
        padding: 0;
        margin: 0 0 16px;
      }
      .identity {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .configuration-note {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 24px;
      }
      .config-section {
        margin-bottom: 28px;
      }
      .section-title {
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
      }
      .field-row {
        width: 100%;
        border: 0;
        border-bottom: 1px solid #383c42;
        background: transparent;
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr) 12px;
        gap: 16px;
        align-items: center;
        padding: 13px 12px;
        text-align: left;
        min-height: 60px;
      }
      .field-row:hover {
        background: var(--surface);
      }
      .field-row[aria-expanded="true"] {
        background: var(--selected);
        box-shadow: inset 2px 0 var(--blue);
      }
      .field-name {
        color: #c9d8e9;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .field-value {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--field);
        border: 1px solid #515761;
        border-radius: 4px;
        min-height: 32px;
        padding: 4px 10px;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .value-wrap {
        min-width: 0;
      }
      .field-hint {
        color: var(--muted);
        font-size: 11px;
        display: block;
        margin-top: 4px;
      }
      .check {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        border: 1px solid #9ba8ba;
        border-radius: 2px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
      }
      .check.on {
        background: #4f6c8b;
        color: white;
      }
      .chevron {
        color: var(--blue);
      }
      .case-group {
        border-top: 1px solid var(--line);
        margin: 20px 0;
      }
      .case-group > summary {
        padding: 16px 8px;
        font-size: 16px;
        font-weight: 500;
      }
      summary {
        cursor: pointer;
      }
      .topics {
        padding-left: 24px;
      }
      .topic {
        border-top: 1px solid #383c42;
      }
      .topic > summary {
        padding: 14px 8px;
        color: #c8d8eb;
      }
      .topic[open] > summary {
        color: var(--blue);
      }
      .topic-flow {
        color: var(--muted);
        display: block;
        padding-left: 16px;
        margin-top: 4px;
        font-size: 12px;
        font-weight: 400;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .inline-case {
        padding: 10px 16px 20px;
      }
      .case-body + .case-body {
        border-top: 1px solid var(--line);
        margin-top: 20px;
        padding-top: 22px;
      }
      .case-id {
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
        margin-bottom: 8px;
      }
      .steps {
        list-style: none;
        padding: 0;
        margin: 0;
        counter-reset: step;
      }
      .steps li {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 10px;
        padding: 0 0 18px;
        counter-increment: step;
      }
      .steps li:before {
        content: counter(step, decimal-leading-zero);
        font-size: 11px;
        color: var(--muted);
        padding-top: 3px;
      }
      .steps p {
        margin: 0;
        font-size: 13px;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      .steps .expected {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .expected strong {
        color: #b8cce4;
        font-weight: 400;
      }
      .metadata {
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0;
      }
      .metadata summary {
        padding: 8px 0;
      }
      .metadata p {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      .metadata ul {
        padding-left: 20px;
      }
      .scope-note {
        font-size: 12px;
        color: var(--muted);
        border-left: 2px solid #727f91;
        padding-left: 12px;
        margin: 8px 0 24px;
      }
      .drawer {
        position: fixed;
        inset: 64px 0 0 auto;
        width: 440px;
        background: var(--surface);
        border-left: 1px solid #626a75;
        display: flex;
        flex-direction: column;
        z-index: 5;
      }
      .drawer-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--line);
      }
      .drawer-top {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .drawer h2 {
        font-size: 19px;
        flex: 1;
        overflow-wrap: anywhere;
      }
      .icon-button {
        background: transparent;
        border: 1px solid #626a75;
        border-radius: 4px;
        padding: 2px 10px;
        font-size: 22px;
      }
      .drawer-content {
        padding: 24px;
        overflow: auto;
        flex: 1;
      }
      .drawer-context {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .drawer-target {
        font-size: 13px;
        margin-top: 12px;
        color: #c9d8e9;
        overflow-wrap: anywhere;
      }
      .subheading {
        font-size: 13px;
        color: var(--muted);
        margin: 24px 0 14px;
      }
      body.detail-open main {
        width: calc(100% - 440px);
        margin-left: 0;
        margin-right: 440px;
        max-width: 1000px;
      }
      body.detail-open .field-row {
        grid-template-columns: 160px minmax(0, 1fr) 12px;
        gap: 12px;
      }
      .empty {
        color: var(--muted);
        padding: 24px 0;
      }
      footer {
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 20px;
        margin-top: 32px;
      }
      @media (min-width: 1500px) {
        body.detail-open main {
          margin-left: auto;
          margin-right: 464px;
        }
      }
      @media (max-width: 1000px) {
        body.detail-open .field-row {
          grid-template-columns: minmax(0, 1fr) 12px;
          gap: 8px;
        }
        body.detail-open .value-wrap {
          grid-column: 1;
        }
        body.detail-open .field-row > .chevron {
          grid-column: 2;
          grid-row: 1/3;
        }
      }
      @media (max-width: 700px) {
        header {
          min-height: 56px;
          padding: 14px 18px;
        }
        header span {
          margin-left: auto;
        }
        main {
          padding: 0 18px;
          margin-top: 24px;
        }
        h1 {
          font-size: 22px;
        }
        .combination-grid {
          grid-template-columns: 1fr;
        }
        .platform-heading {
          flex-wrap: wrap;
        }
        select {
          min-width: 0;
          flex: 1;
        }
        .field-row {
          grid-template-columns: minmax(0, 1fr) 12px;
          gap: 8px;
          padding: 12px 8px;
        }
        .value-wrap {
          grid-column: 1;
        }
        .field-row > .chevron {
          grid-column: 2;
          grid-row: 1/3;
        }
        .drawer {
          inset: 0;
          width: 100%;
        }
        .drawer-header,
        .drawer-content {
          padding: 20px;
        }
        body.detail-open {
          overflow: hidden;
        }
        body.detail-open main {
          width: 100%;
          margin: 24px auto;
        }
        .topics {
          padding-left: 12px;
        }
        .inline-case {
          padding: 8px 6px 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }

      .category-nav {
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--canvas);
        padding-top: 12px;
        margin-bottom: 0;
      }
      .browse-tools {
        position: sticky;
        top: 51px;
        z-index: 3;
        background: var(--canvas);
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px 0 16px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 24px;
      }
      .search-box {
        flex: 1 1 230px;
        min-width: 140px;
      }
      .search-box input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #626a75;
        border-radius: 4px;
        padding: 7px 10px;
        background: var(--field);
        color: var(--ink);
        font: inherit;
      }
      .search-box input:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
      .browse-tools button {
        background: none;
        border: 1px solid #626a75;
        border-radius: 4px;
        padding: 7px 10px;
        font-size: 12px;
      }
      .browse-tools button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #search-status {
        width: 100%;
        font-size: 12px;
        color: var(--muted);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .topic-flow {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .topic[open] > summary .topic-flow {
        display: block;
      }
      .card-fields b {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-title {
        line-height: 1.6;
      }
      .case-group,
      .topic,
      .field-row,
      .combo-card {
        scroll-margin-top: 165px;
      }
      mark {
        background: #4f4629;
        color: #fff0b0;
        border-radius: 2px;
      }
      .no-match {
        color: var(--muted);
        padding: 22px 16px;
        border: 1px dashed #626a75;
        border-radius: 4px;
      }
      @media (max-width: 700px) {
        .browse-tools {
          top: 51px;
          gap: 7px;
        }
        .search-box {
          flex-basis: 100%;
        }
        .browse-tools button {
          padding: 5px 9px;
        }
        .case-group,
        .topic,
        .field-row,
        .combo-card {
          scroll-margin-top: 220px;
        }
      }

      .qa-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin: -8px 0 22px;
      }
      .qa-actions button,
      .qa-button {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid #626a75;
        border-radius: 4px;
        padding: 6px 11px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .qa-actions span {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .qa-link {
        background: none;
        border: 0;
        padding: 0 6px;
        color: var(--blue);
        font-size: 11px;
      }
      .draft-badge {
        display: block;
        color: #ddc998;
        font-size: 11px;
        margin-top: 4px;
      }
      .field-row .coverage-label {
        display: none;
      }
      #qa-dialog {
        width: min(820px, calc(100% - 32px));
        max-height: 88vh;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid #626a75;
        border-radius: 6px;
        padding: 0;
      }
      #qa-dialog::backdrop {
        background: #0009;
      }
      .qa-dialog-head {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        background: var(--surface);
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        z-index: 1;
      }
      #qa-close {
        background: none;
        color: var(--ink);
        border: 0;
        font-size: 24px;
        padding: 0 8px;
      }
      #qa-body {
        padding: 20px 22px;
      }
      #qa-foot {
        padding: 14px 22px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .qa-note {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 16px;
      }
      .qa-warning {
        border-left: 2px solid #ad996a;
        padding-left: 10px;
        color: #d6c7a5;
        font-size: 12px;
      }
      .qa-form label {
        display: block;
        margin: 12px 0;
        font-size: 12px;
        color: #c7d5e7;
      }
      .qa-form input:not([type="checkbox"]),
      .qa-form textarea,
      .qa-form select {
        display: block;
        width: 100%;
        min-width: 0;
        margin-top: 6px;
        padding: 7px 9px;
        color: var(--ink);
        border: 1px solid #626a75;
        border-radius: 4px;
        background: var(--field);
        font: inherit;
      }
      .qa-form textarea {
        min-height: 75px;
        resize: vertical;
      }
      .qa-form input:focus-visible,
      .qa-form textarea:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      .qa-form small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 5px;
      }
      .qa-edit-row {
        display: grid;
        grid-template-columns: minmax(140px, 36%) 1fr;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
        align-items: center;
      }
      .qa-edit-row label {
        margin: 0;
      }
      .qa-edit-row input,
      .qa-edit-row select {
        margin-top: 0 !important;
      }
      .qa-details {
        margin: 16px 0;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .qa-details summary {
        font-size: 13px;
      }
      .qa-list-row {
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
        font-size: 12px;
      }
      .qa-list-row label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 0;
      }
      .qa-list-row small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .qa-stage {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 12px;
      }
      .qa-error {
        color: #efb8ad;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .qa-button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      @media (max-width: 700px) {
        .qa-edit-row {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .qa-dialog-head,
        #qa-body,
        #qa-foot {
          padding-left: 16px;
          padding-right: 16px;
        }
        .qa-actions span {
          width: 100%;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <header><strong>PinK / 构建用例</strong><span>只读目录</span></header>
    <main id="main">
      <h1>构建测试用例</h1>
      <nav class="category-nav" aria-label="用例分类">
        <button data-route="platform">平台配置</button>
        <button data-route="public">公共界面</button>
      </nav>
      <div class="browse-tools" role="search" aria-label="查找当前目录">
        <label class="search-box"
          ><span class="sr-only">查找当前页面的用例、字段或配置</span
          ><input
            id="catalog-search"
            type="search"
            placeholder="查找名称、字段、用例 ID…"
            autocomplete="off"
        /></label>
        <button id="clear-search" type="button" hidden>清空</button>
        <button id="expand-all" type="button">展开全部</button>
        <button id="collapse-all" type="button">收起全部</button>
        <span id="search-status" role="status" aria-live="polite"></span>
      </div>
      <div class="qa-actions" aria-label="用例辅助操作">
        <button type="button" id="qa-files">用例文件</button>
        <button type="button" id="qa-edit">编辑当前用例</button>
        <button type="button" id="qa-materials">材料</button>
        <button type="button" id="qa-plan">本轮计划</button>
        <span id="qa-draft-status" role="status">浏览目录</span>
      </div>
      <div id="page"></div>
      <p id="no-match" class="no-match" hidden>
        当前页面没有匹配项。请更换关键词，或清空搜索查看全部。
      </p>
      <footer>配置、操作与预期来自已维护的用例。点击字段查看详情。</footer>
    </main>
    <aside
      id="drawer"
      class="drawer"
      role="dialog"
      aria-modal="false"
      aria-labelledby="detail-title"
      hidden
    >
      <div class="drawer-header">
        <div id="detail-context" class="drawer-context"></div>
        <div class="drawer-top">
          <h2 id="detail-title"></h2>
          <button
            id="close-detail"
            class="icon-button"
            aria-label="关闭字段用例"
          >
            ×
          </button>
        </div>
        <div id="detail-target" class="drawer-target"></div>
      </div>
      <div id="detail-content" class="drawer-content"></div>
    </aside>
    <dialog id="qa-dialog" aria-labelledby="qa-title">
      <div class="qa-dialog-head">
        <h2 id="qa-title"></h2>
        <button type="button" id="qa-close" aria-label="关闭辅助窗口">×</button>
      </div>
      <div id="qa-body"></div>
      <div id="qa-foot"></div>
    </dialog>
    <!-- CASE_CATALOG -->
    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const data = JSON.parse($("catalog-data").textContent);
        const basePresentation = structuredClone(data.presentation);
        let model = data.presentation;
        const byId = new Map(data.cases.map((c) => [c.id, c]));
        const esc = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const enums = {
          none: "无压缩",
          merge_dep: "合并依赖",
          merge_all_json: "合并所有 JSON",
          subpackage: "小游戏分包",
          "physics-ammo": "Bullet",
          "physics-builtin": "Builtin",
          "physics-cannon": "Cannon",
          "physics-2d-builtin": "2D Builtin",
          "physics-2d-box2d": "2D Box2D",
          "physics-2d-box2d-wasm": "2D Box2D Wasm",
          "physics-2d-box2d-jsb": "2D Box2D JSB",
          zip: "Zip",
          tbb: "TBB",
          "inherit-project-setting": "继承工程设置",
          portrait: "竖屏",
          landscape: "横屏",
          landscapeRight: "右横屏",
          landscapeLeft: "左横屏",
          auto: "自动",
          taskFlow: "TaskFlow",
          inline: "内联",
          asmjs: "asm.js",
          wasm: "Wasm",
          on: "开启",
          off: "关闭",
        };
        let currentPlatform;
        let currentCombo;
        let returnFocus;
        const narrow = window.matchMedia("(max-width:700px)");
        function displayValue(key, value) {
          if (value && typeof value === "object") {
            if (Object.hasOwn(value, "$material"))
              return `材料引用：${value.$material}`;
            if (Object.hasOwn(value, "$scene"))
              return `运行时场景：${value.$scene}`;
            if (privateField(key)) return "私有参数（不展示）";
            return JSON.stringify(value);
          }
          if (privateField(key)) return "私有参数（不展示）";
          if (typeof value === "boolean") return value ? "开启" : "关闭";
          if (value === "") return "留空";
          if (key === "sourceMaps")
            return (
              { false: "关闭", true: "独立", inline: "内联" }[value] ??
              String(value)
            );
          if (key.endsWith(".JobSystem") && value === "none") return "无";
          return enums[value] ?? String(value);
        }
        function safeLink(href) {
          if (
            typeof href !== "string" ||
            (/^(?:[a-z][a-z\d+.-]*:|\/\/)/i.test(href) &&
              !/^https?:\/\//i.test(href))
          )
            return "";
          return href;
        }
        function links(items) {
          return (items ?? [])
            .filter(Boolean)
            .map((s) => {
              const href = safeLink(s.href);
              return href
                ? `<li><a href="${esc(href)}" target="_blank" rel="noopener">${esc(s.label ?? href)}</a>${s.version ? ` · ${esc(s.version)}` : ""}</li>`
                : "";
            })
            .join("");
        }
        function caseBody(id, heading = true) {
          const original = byId.get(id);
          const live =
            normalizedDocument?.platforms
              .flatMap((p) => p.combinations)
              .find((c) => c.id === id) ??
            normalizedDocument?.conditionalScenarios.find((c) => c.id === id);
          if (!original && !live) return "";
          const c = {
            ...original,
            id,
            ...(live
              ? {
                  title: live.title,
                  steps: live.steps ?? original?.steps ?? [],
                  notes: Array.isArray(live.notes)
                    ? live.notes.join("；")
                    : (live.notes ?? original?.notes),
                  prerequisites: Array.isArray(live.materials)
                    ? live.materials.join("；")
                    : original?.prerequisites,
                }
              : {}),
          };
          const title = c.id.startsWith("configuration.openpaas.")
            ? `${c.title}（通用入口，OpenPaaS 使用专属流程）`
            : c.title;
          return `<article class="case-body" data-case-id="${esc(id)}">
            ${heading ? `<h3>${esc(title)}</h3>` : ""}
            <div class="case-id">${esc(id)} <button type="button" class="qa-link" data-qa-case="${esc(id)}">补充建议</button></div>
            ${c.applicability?.status === "conditional" ? `<p class="scope-note">${esc(c.applicability.reason)}</p>` : ""}
            <ol class="steps">${(c.steps ?? []).map((s) => `<li><div><p>${esc(s.action)}</p><p class="expected"><strong>预期</strong>　${esc(s.expected)}</p></div></li>`).join("")}</ol>
            <details class="metadata"><summary>前提与依据</summary>
              ${c.prerequisites ? `<p>${esc(c.prerequisites)}</p>` : ""}
              ${c.notes ? `<p>${esc(c.notes)}</p>` : ""}
              ${c.grouping ? `<p>${esc(c.grouping)}</p>` : ""}
              <ul>${links(c.sources)}</ul>
              ${c.evidence?.length ? `<p>以下为原目录历史记录，尚未与当前载入文档的 SHA256 关联，不能证明修改后的用例已通过。</p><ul>${links(c.evidence)}</ul>` : ""}
            </details>
          </article>`;
        }
        function topicCase(id) {
          const c = byId.get(id);
          const title = c.id.startsWith("configuration.openpaas.")
            ? `${c.title}（通用入口）`
            : c.title;
          return `<details class="topic" data-search-entry data-topic-case="${esc(id)}"><summary>${esc(title)}</summary><div class="inline-case">${caseBody(id, false)}</div></details>`;
        }
        function platformPicker() {
          return `<div class="platform-heading"><label for="platform-select">平台</label><select id="platform-select">${model.platforms.map((p) => `<option value="${esc(p.id)}" ${p.id === currentPlatform.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>`;
        }
        function overview() {
          $("page").innerHTML =
            platformPicker() +
            `<p class="configuration-note">四组用例定稿 · 选择组合查看本平台搭配</p>` +
            `<div class="combination-grid">${currentPlatform.combinations
              .map((c) => {
                if (c.kind === "conditional")
                  return `<button class="combo-card" data-search-entry data-combo="${esc(c.id)}"><span class="card-title">${esc(c.title)}</span><span class="card-fields"><span><em>条件场景</em><b>L10N、资源及本平台特殊前提</b></span><span><em>适用范围</em><b>按场景选择，不全部同时开启</b></span></span><span class="card-bottom">查看启用条件与检查点 <span aria-hidden="true">›</span></span></button>`;
                const fields = c.summaryKeys
                  .map((key) => {
                    const row = currentPlatform.fields.find(
                      (f) => f.key === key,
                    );
                    return `<span><em>${esc(row?.label ?? key)}</em><b>${esc(displayValue(key, c.values[key]))}</b></span>`;
                  })
                  .join("");
                const preserved = c.summaryKeys.some((key) =>
                  key.startsWith("packages."),
                )
                  ? ""
                  : "<span><em>平台专用配置</em><b>沿用当前配置</b></span>";
                return `<button class="combo-card" data-search-entry data-combo="${esc(c.id)}"><span class="card-title">${esc(c.title)}</span><span class="card-fields">${fields}${c.id.startsWith("planned.") ? "" : preserved}</span><span class="card-bottom">完整配置与用例 <span aria-hidden="true">›</span></span></button>`;
              })
              .join("")}</div>` +
            (currentPlatform.standaloneIds.length
              ? `<details class="case-group"><summary>平台界面专项</summary><div class="topics">${currentPlatform.standaloneIds.map(topicCase).join("")}</div></details>`
              : "");
        }
        function valueFor(row) {
          if (currentCombo.excludedFields?.includes(row.key))
            return "本平台不适用（已从执行目标排除）";
          if (row.unavailable) return row.unavailable;
          return Object.hasOwn(currentCombo.values, row.key)
            ? currentCombo.values[row.key]
            : currentCombo.unspecified;
        }
        function valueMarkup(row) {
          const value = valueFor(row);
          return `<span class="field-value">${typeof value === "boolean" ? `<span class="check ${value ? "on" : ""}" aria-hidden="true">${value ? "✓" : ""}</span>` : ""}${esc(displayValue(row.key, value))}</span><small class="coverage-label">${esc(coverageLabel(fieldCoverage(row.key).state))}</small>`;
        }
        function coverageLabel(state) {
          return model.coveragePolicy.legend[state] ?? "待补前提";
        }
        function fieldCoverage(key) {
          return (
            currentCombo.fieldCoverage?.[key] ?? {
              state: "retain",
              condition: "按实际可见性回读。",
              expected: "本组未指定目标，只保留回读，不计修改或候选覆盖。",
            }
          );
        }
        function condition(row) {
          const notes = [...(currentCombo.conditions?.[row.key] ?? [])];
          if (currentCombo.hidden.includes(row.key))
            notes.push("目标状态下隐藏；任务表示按已确认合同核对");
          if (currentCombo.hiddenInitially.includes(row.key))
            notes.push("初态隐藏；先操作父项，再配置本字段");
          if (currentCombo.retained.includes(row.key))
            notes.push("回读并核对保持一致");
          return notes.join("；");
        }
        function configuration() {
          if (currentCombo.kind === "conditional") {
            conditionalConfiguration();
            return;
          }
          $("page").innerHTML =
            `<button class="back" data-back>‹ 返回 ${esc(currentPlatform.name)} 的组合</button>
            <div class="identity">${esc(currentPlatform.name)}</div><h2 id="combo-title" tabindex="-1">${esc(currentCombo.title)}</h2>
            <p class="configuration-note">明确检查 / 仅保留回读 / 待补材料或候选均为设计分类，不代表已执行通过。</p>` +
            `<section class="config-section"><h3 class="section-title">测试输入</h3><dl>${Object.entries(
              currentCombo.inputs,
            )
              .map(
                ([label, value]) =>
                  `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`,
              )
              .join(
                "",
              )}</dl>${currentCombo.materials.length ? `<p class="scope-note">材料前提：${esc(currentCombo.materials.join("；"))}</p>` : ""}</section>` +
            [
              ["common", "公共配置"],
              ["special", "平台专用配置"],
            ]
              .map(
                ([group, title]) =>
                  `<section class="config-section"><h3 class="section-title">${title}</h3>${currentPlatform.fields
                    .filter(
                      (f) =>
                        f.section === group &&
                        !f.key.startsWith("packages.localization-editor."),
                    )
                    .map(
                      (row) =>
                        `<button class="field-row" data-search-entry data-field="${esc(row.key)}" aria-expanded="false" aria-controls="drawer">
                <span class="field-name">${esc(row.label)}</span><span class="value-wrap">${valueMarkup(row)}${condition(row) ? `<small class="field-hint">${esc(condition(row))}</small>` : ""}</span><span class="chevron" aria-hidden="true">›</span>
              </button>`,
                    )
                    .join("")}</section>`,
              )
              .join("") +
            (currentCombo.variants.length
              ? `<details class="case-group"><summary>本组合的平台配置变体（${currentCombo.variants.length}）</summary><div class="topics">${currentCombo.variants
                  .map(
                    (v) =>
                      `<details class="topic"><summary>${esc(v.title)} <span class="coverage-label">${esc(coverageLabel(v.coverageState))}</span></summary><div class="inline-case"><p>沿用本组合，仅覆盖以下目标：</p><dl>${Object.entries(
                        v.values,
                      )
                        .map(
                          ([key, value]) =>
                            `<dt>${esc(currentPlatform.fields.find((f) => f.key === key)?.label ?? key)}</dt><dd>${esc(displayValue(key, value))}</dd>`,
                        )
                        .join(
                          "",
                        )}</dl><p>覆盖：${esc(v.covers)}</p><p>预期：${esc(v.expectation)}</p><p>初态：${esc(v.initialCondition)}</p>${v.requires ? `<p>前提：${esc(v.requires)}</p>` : ""}${v.note ? `<p>${esc(v.note)}</p>` : ""}</div></details>`,
                  )
                  .join("")}</div></details>`
              : "") +
            `<details class="case-group" data-search-entry><summary>组合整体检查</summary><div class="inline-case">${caseBody(currentCombo.id)}</div></details>`;
        }
        function conditionalConfiguration() {
          const platformNames = (ids) =>
            ids
              .map((id) => model.platforms.find((p) => p.id === id)?.name ?? id)
              .join("、");
          const inputLabel = (key) =>
            currentPlatform.fields.find(
              (f) =>
                f.key === key ||
                f.key === `packages.${currentPlatform.id}.${key}`,
            )?.label ?? key;
          $("page").innerHTML =
            `<button class="back" data-back>‹ 返回 ${esc(currentPlatform.name)} 的组合</button>
            <div class="identity">${esc(currentPlatform.name)}</div><h2 id="combo-title" tabindex="-1">${esc(currentCombo.title)}</h2>
            <p class="configuration-note">按前提选择场景 · 只读用例</p>
            <p>正向构建以<a href="#platform=${encodeURIComponent(currentPlatform.id)}&amp;combination=${encodeURIComponent(`review.publish.${currentPlatform.id}`)}">本平台发布组</a>为基础。L10N 未启用时语言选项不存在是正确预期；启用并就绪后才操作。</p>
            <details class="case-group"><summary>表单反向校验</summary><div class="topics">
            <p>公共字段由 Web 桌面代表覆盖。已定义执行操作的样本随完整用例导出，按 ID 单独选择，仅检查输入、提示、按钮和恢复，不点击构建。样本定义不代表实测通过，实机范围与受阻项以对应报告为准。</p>
            ${currentPlatform.id !== "web-desktop" ? `<p><a href="#platform=web-desktop&amp;combination=review.conditional.web-desktop">查看公共字段反向用例</a></p>` : ""}
            ${(
              (normalizedDocument ?? caseDocument ?? data.executionSource)
                ?.formValidation?.cases ?? []
            )
              .filter((c) => c.platforms.includes(currentPlatform.id))
              .map(
                (c) =>
                  `<details class="topic" data-search-entry><summary>${esc(c.title)}</summary><div class="inline-case"><p>${esc(c.condition)}</p>${(
                    c.samples ?? []
                  )
                    .filter((s) => s.platforms.includes(currentPlatform.id))
                    .map(
                      (s) =>
                        `<details class="topic"><summary>${esc(s.title)}${s.kind === "applicability-only" ? "（范围说明）" : ""}</summary><div class="inline-case"><dl>${Object.entries(
                          {
                            前提: s.condition,
                            输入: s.input,
                            触发动作: s.trigger,
                            预期提示: s.prompt,
                            预期修正: s.correction,
                            按钮状态: s.button,
                            任务行为: s.task,
                            恢复检查: s.recovery,
                            执行入口:
                              s.execution ||
                              s.executionByPlatform?.[currentPlatform.id]
                                ? `${s.id}.${currentPlatform.id}`
                                : s.kind === "applicability-only"
                                  ? "范围说明，不计执行覆盖"
                                  : (s.executionBlocker ?? "缺少结构化操作"),
                          },
                        )
                          .map(
                            ([label, value]) =>
                              `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`,
                          )
                          .join(
                            "",
                          )}</dl><p class="muted">${esc(s.evidence)}</p></div></details>`,
                    )
                    .join(
                      "",
                    )}<details class="metadata"><summary>预期依据与证据边界</summary><p>${esc(c.id)} · ${esc(c.coverage)}</p><dl>${Object.entries(
                    c.basis ?? {},
                  )
                    .map(
                      ([key, value]) =>
                        `<dt>${esc({ promptAndCorrection: "提示与修正", buttonAndTask: "按钮与任务", recovery: "恢复" }[key] ?? key)}</dt><dd>${esc(value)}</dd>`,
                    )
                    .join(
                      "",
                    )}</dl><p>${esc((c.sourceRefs ?? []).map((key) => (normalizedDocument ?? caseDocument ?? data.executionSource)?.formValidation?.sources?.[key] ?? key).join("；"))}</p></details></div></details>`,
              )
              .join("")}
            </div></details>
            <div class="topics">${currentCombo.scenarios
              .map((s) => {
                const shared =
                  s.representativePlatforms.length < s.platforms.length;
                const scope =
                  s.platforms.length === model.platforms.length
                    ? "18 平台条件适用"
                    : platformNames(s.platforms);
                return `<details class="topic" data-search-entry><summary>${esc(s.title)} <span class="coverage-label">${esc(coverageLabel(s.coverageState))}</span></summary><div class="inline-case">
                <p>适用：${esc(scope)}${shared ? `；共享检查默认代表：${esc(platformNames(s.representativePlatforms))}，其余平台仅补差异` : ""}。</p>
                ${s.pendingQuestion ? `<p>待补前提：${esc(s.pendingQuestion)}；前提满足后才执行对应分支。</p>` : ""}
                <h3 class="section-title">启用条件</h3><ul>${s.enableConditions.map((text) => `<li>${esc(text)}</li>`).join("")}</ul>
                <h3 class="section-title">测试输入</h3><dl>${Object.entries(
                  s.inputs,
                )
                  .map(
                    ([key, value]) =>
                      `<dt>${esc(inputLabel(key))}</dt><dd>${esc(displayValue(key, value))}</dd>`,
                  )
                  .join("")}</dl>
                ${s.materials.length ? `<p>材料前提：${esc(s.materials.join("；"))}</p>` : ""}
                <h3 class="section-title">步骤与预期</h3><ol>${s.steps.map((step) => `<li>${esc(step.action)}<p>${esc(step.expected)}</p></li>`).join("")}</ol>
                <h3 class="section-title">检查点</h3><ul>${s.checkpoints.map((text) => `<li>${esc(text)}</li>`).join("")}</ul>
                <p>终点：${esc(s.endpoint)}。</p>${s.expectationBasis ? `<p class="muted">${esc(s.expectationBasis)}</p>` : ""}${s.notes.length ? `<p>${esc(s.notes.join("；"))}</p>` : ""}
              </div></details>`;
              })
              .join("")}</div>
            <details class="case-group"><summary>待确认的规则</summary><div class="topics">${currentCombo.reviewItems.map((item) => `<details class="topic" data-search-entry><summary>${esc(item.title)} <span class="coverage-label">待确认</span></summary><div class="inline-case"><p>所属组：${esc(item.group)}</p><p>输入提案：${esc(item.inputs)}</p><p>需确认：${esc(item.question)}</p></div></details>`).join("")}</div></details>
            <details class="case-group"><summary>基础配置、分组与恢复</summary><div class="inline-case">${Object.values(
              model.conditionalPolicy,
            )
              .map((text) => `<p>${esc(text)}</p>`)
              .join("")}</div></details>`;
        }
        function publicPage() {
          $("page").innerHTML = model.publicGroups
            .map(
              (g) =>
                `<details class="case-group"><summary>${esc(g.name)}</summary><div class="topics">${g.topics
                  .map(
                    (t) =>
                      `<details class="topic" data-search-entry><summary>${esc(t.name)}<span class="topic-flow">${esc(t.caseIds.map((id) => byId.get(id).steps?.[0]?.action ?? byId.get(id).title).join("；"))}</span></summary><div class="inline-case">${t.caseIds.map((id) => caseBody(id)).join("")}</div></details>`,
                  )
                  .join("")}</div></details>`,
            )
            .join("");
        }
        function closeDetail(focus = true) {
          $("drawer").hidden = true;
          $("drawer").setAttribute("aria-modal", "false");
          $("main").inert = false;
          document.body.classList.remove("detail-open");
          document
            .querySelectorAll("[data-field]")
            .forEach((el) => el.setAttribute("aria-expanded", "false"));
          if (focus && returnFocus?.isConnected)
            returnFocus.focus({ preventScroll: true });
        }
        function setDrawerMode() {
          if ($("drawer").hidden) return;
          $("drawer").setAttribute("aria-modal", String(narrow.matches));
          $("main").inert = narrow.matches;
        }
        function openField(key, trigger) {
          const row = currentPlatform.fields.find((r) => r.key === key);
          if (!row) return;
          returnFocus = trigger;
          $("detail-context").textContent =
            `${currentPlatform.name} / ${currentCombo.title} / ${row.section === "common" ? "公共配置" : "平台专用配置"}`;
          $("detail-title").textContent = row.label;
          $("detail-target").textContent = displayValue(row.key, valueFor(row));
          const fixed =
            Object.hasOwn(currentCombo.values, key) && !row.unavailable;
          const coverage = fieldCoverage(key);
          const own = fixed && coverage.state === "specified";
          const initial = Object.hasOwn(currentCombo.initial, key)
            ? `<p class="scope-note">要求初态：${esc(displayValue(key, currentCombo.initial[key]))}</p>`
            : "";
          const linked = row.refs.filter((id) => id !== currentCombo.id);
          $("detail-content").innerHTML =
            `<p class="scope-note">${esc(coverageLabel(coverage.state))}：${esc(coverage.expected)}</p><p class="scope-note">启用条件：${esc(coverage.condition)}</p>` +
            initial +
            (condition(row)
              ? `<p class="scope-note">${esc(condition(row))}</p>`
              : "") +
            (own
              ? `<div class="subheading">本组合关联用例</div>${caseBody(currentCombo.id)}`
              : `<p class="scope-note">${excluded ? "共享定义明确排除此平台字段，不作为本组合执行目标；相关专项仍须独立核对适用性。" : row.unavailable ? esc(row.unavailable) : "本组合未给这个字段指定固定目标。下方相关专项独立检查，不表示本组合执行了全部分支。"}</p>`) +

        initialiseDocument();
        render();
      })();
    </script>
